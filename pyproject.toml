[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtop-nv"
dynamic = ["version"]
description = "htop + nvtop in one terminal UI: CPU, memory, GPU and per-process VRAM (Windows, Linux, macOS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Soksedtha Ly" }]
requires-python = ">=3.10"
keywords = ["htop", "nvtop", "gpu", "nvidia", "vram", "system-monitor", "tui", "windows", "linux", "macos"]
dependencies = [
    "psutil>=7.0",
    "nvidia-ml-py>=12.0",
    "textual>=8.0",
    "pywin32>=306; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
gtop = "gtop_nv.app:main"

[project.urls]
Homepage = "https://github.com/gtmetric/gtop"
Issues = "https://github.com/gtmetric/gtop/issues"

[tool.hatch.version]
path = "gtop_nv/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gtop_nv"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/.venv", "/.github"]
